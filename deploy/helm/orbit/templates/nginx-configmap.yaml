apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orbit.fullname" . }}-nginx
data:
  default.conf: |
    upstream catalog {
        server {{ include "orbit.fullname" . }}-catalog:{{ .Values.catalog.service.port }};
    }

    upstream gate {
        server {{ include "orbit.fullname" . }}-gate:{{ .Values.gate.service.port }};
    }

    # Preserve the public scheme supplied by the Ingress for OAuth callbacks.
    map $http_x_forwarded_proto $public_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_accept $wants_html {
        default     0;
        ~*text/html 1;
    }

    server {
        listen {{ .Values.nginx.service.port }};
        server_name _;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Login and callback must be reachable without authentication.
        location /auth/ {
            proxy_pass http://gate;
        }

        # Exact match overrides /auth/ and permits only nginx subrequests.
        location = /auth/check {
            internal;
            proxy_pass http://gate/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Preserve the application's existing public health and info routes.
        location ~ ^/(health|info)($|/) {
            proxy_pass http://catalog;
        }

        location / {
            auth_request /auth/check;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_name $upstream_http_x_user_name;
            auth_request_set $user_email $upstream_http_x_user_email;

            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-User-Name $user_name;
            proxy_set_header X-User-Email $user_email;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            error_page 401 = @unauthorised;
            proxy_pass http://catalog;
        }

        location @unauthorised {
            absolute_redirect off;
            # As in the previous config, the return path omits query parameters.
            if ($wants_html) {
                return 302 /auth/login?rd=$uri;
            }
            return 401;
        }
    }
