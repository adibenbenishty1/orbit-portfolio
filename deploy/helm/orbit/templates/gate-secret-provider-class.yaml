apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: orbit-gate-secrets
spec:
  provider: aws

  secretObjects:
    - secretName: orbit-gate-secrets
      type: Opaque
      data:
        - objectName: JWT_SECRET
          key: JWT_SECRET
        - objectName: AUTH_CLIENT_SECRET
          key: AUTH_CLIENT_SECRET

  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: {{ .Values.gate.secrets.jwtSecretObject | quote }}
        objectType: "secretsmanager"
        jmesPath:
          - path: "JWT_SECRET"
            objectAlias: "JWT_SECRET"

      - objectName: {{ .Values.gate.secrets.authClientSecretObject | quote }}
        objectType: "secretsmanager"
        jmesPath:
          - path: "AUTH_CLIENT_SECRET"
            objectAlias: "AUTH_CLIENT_SECRET"
