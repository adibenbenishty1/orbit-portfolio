apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: orbit-catalog-secrets
spec:
  provider: aws

  secretObjects:
    - secretName: orbit-catalog-secrets
      type: Opaque
      data:
        - objectName: DB_USER
          key: DB_USER
        - objectName: DB_PASSWORD
          key: DB_PASSWORD

  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: {{ .Values.catalog.secrets.databaseSecretObject | quote }}
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "DB_USER"
          - path: "password"
            objectAlias: "DB_PASSWORD"
