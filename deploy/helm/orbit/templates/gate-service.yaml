apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbit.fullname" . }}-gate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: gate
  ports:
    - name: http
      port: {{ .Values.gate.service.port }}
      targetPort: http
