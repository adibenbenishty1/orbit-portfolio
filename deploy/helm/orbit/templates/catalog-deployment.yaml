apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbit.fullname" . }}-catalog
spec:
  replicas: {{ .Values.catalog.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/component: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/component: catalog
    spec:
      serviceAccountName: orbit-catalog
      imagePullSecrets:
        - name: ghcr-credentials
      initContainers:
        - name: catalog-migrate
          image: "{{ .Values.catalog.image.repository }}:{{ .Values.catalog.image.tag }}"
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "orbit.catalog.env" . | nindent 12 }}
          volumeMounts:
            - name: catalog-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      containers:
        - name: catalog
          image: "{{ .Values.catalog.image.repository }}:{{ .Values.catalog.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.catalog.service.port }}
          env:
            {{- include "orbit.catalog.env" . | nindent 12 }}

          volumeMounts:
            - name: catalog-secrets
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        - name: catalog-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: orbit-catalog-secrets
