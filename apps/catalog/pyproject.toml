[tool.poetry]
name = "catalog"
version = "0.2.1"
description = "Business service for orbit. Serves a list of items and contains no security code."
authors = ["Adi Benbenishty <adibenbenishty@gmail.com>"]
packages = [{ include = "catalog" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.116,<1.0"
uvicorn = ">=0.30,<1.0"
pydantic-settings = "^2.0"
click = "^8.1"
httpx = ">=0.28,<1.0"
prometheus-fastapi-instrumentator = "^8.1"
sqlalchemy = "^2.0"
psycopg = {version = "^3.2", extras = ["binary"]}
alembic = "^1.20.0"

[tool.poetry.scripts]
catalog = "catalog.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
