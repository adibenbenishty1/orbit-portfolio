# ~
#
# Local stack for orbit
#
# Application services and PostgreSQL share a private network. This file defines
# which of them can be reached from outside it: nginx publishes a port and
# gate and catalog publish none, so the only route to a business service is
# through the authentication proxy. The security model relies on this topology.
#
#     docker compose up --build          start it
#     docker compose down                stop it and remove the network
#
# ------------------------------------------------


name: orbit


services:

  # nginx
  # -----
  # the only service with a route in from the host, and the only one that is
  # not built. upstream image, pinned: an ingress controller is installed
  # rather than made, and this is the compose-shaped rehearsal for one.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '8080:80'
    volumes:
      - type: bind
        source: ./deploy/nginx/orbit.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      gate:
        condition: service_healthy
      catalog:
        condition: service_healthy
    restart: unless-stopped

  # gate
  # ----
  # no ports key, deliberately. gate is reachable at http://gate:5001 from
  # inside this network and from nowhere else -- including from the browser
  # that is about to log in through it, which reaches it via nginx.
  gate:
    build:
      context: .
      dockerfile: apps/gate/Dockerfile
      args:
        VERSION: ${VERSION:-unknown}
        COMMIT: ${COMMIT:-unknown}
    # the tenant's client secret and namespaced claim, read at run time and
    # never baked into a layer. optional because it is gitignored: a fresh
    # clone has no such file and should still come up, with a placeholder
    # provider and a login that goes nowhere real.
    env_file:
      - path: apps/gate/.env
        required: false
    environment:
      # where to reach gate from elsewhere -- used by its cli, not as a bind
      # address. the default says localhost, which is a lie inside a network
      # where the name is gate.
      GATE_HOST: gate
    healthcheck:
      # a slim python image has no curl and no wget, and adding one to be
      # probed with would put a binary in the runtime image for the sake of
      # a liveness check. python is already there.
      #
      # /health/ready rather than /ping: the question compose actually means
      # is not whether the process answers but whether it may be sent
      # traffic. gate's health router arrived from ORB-002 for this line --
      # being its caller is why that recovery waited.
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:5001/health/ready').read()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # catalog
  # -------
  # no ports key either, and this is the one that matters. catalog contains
  # no security code at all: anything that can reach it is already whoever
  # it claims to be. the network boundary is the entire defence.
  catalog:
    build: &catalog-build
      context: .
      dockerfile: apps/catalog/Dockerfile
      args:
        VERSION: ${VERSION:-unknown}
        COMMIT: ${COMMIT:-unknown}
    environment: &catalog-environment
      CATALOG_HOST: catalog
      DB_HOST: postgres
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    healthcheck:
      # catalog already has the health router gate is still missing, so this
      # one can ask the question it means: not is the process alive, but is
      # it ready to be sent traffic.
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/ready').read()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Run the same image against the same database before starting the API.
  catalog-migrate:
    build: *catalog-build
    environment: *catalog-environment
    command: ['alembic', 'upgrade', 'head']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # postgres
  # --------
  # Local development database for catalog.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: orbit-dev
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d orbit']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped


volumes:
  postgres-data:
